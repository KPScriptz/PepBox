name: Build PepBox

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Build app
        run: |
          set -o pipefail
          xcodebuild -project PepBox.xcodeproj -scheme PepBox \
            -configuration Release \
            -derivedDataPath build \
            -destination 'generic/platform=macOS' \
            -skipPackagePluginValidation -skipMacroValidation \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="" \
            build 2>&1 | tee build.log | grep -E '(error|warning: unable|BUILD (SUCCEEDED|FAILED))' || true
          grep -q 'BUILD SUCCEEDED' build.log

      - name: Show compiler errors
        if: failure()
        run: |
          echo "=== errors ==="
          grep -E '(^|[^-W])error:' build.log | grep -v 'Werror' | cut -c1-600 | sort -u | head -100 || true
          echo "=== compiler crash context ==="
          grep -nE 'Stack dump|^[0-9]+\.\s|While (running|evaluating|emitting|silgen)|Running pass|error: compile command failed|Assertion' build.log | grep -v '^\S*:[0-9]* swift-frontend' | cut -c1-500 | head -60 || true
          echo "=== failed commands ==="
          sed -n '/The following build commands failed/,$p' build.log | cut -c1-400 | head -40 || true
          echo "=== last lines ==="
          grep -v '^    ' build.log | cut -c1-400 | tail -60 || true

      - name: Bundle updater helper
        run: |
          APP=build/Build/Products/Release/PepBox.app
          for arch in arm64 x86_64; do
            swiftc -o build/PepBoxUpdater-$arch PepBoxUpdater/main.swift \
              -framework AppKit -framework SwiftUI -O -target $arch-apple-macos14.0
          done
          mkdir -p "$APP/Contents/Helpers"
          lipo -create build/PepBoxUpdater-arm64 build/PepBoxUpdater-x86_64 \
            -output "$APP/Contents/Helpers/PepBoxUpdater"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"

      - name: Check bundle contents
        run: |
          APP=build/Build/Products/Release/PepBox.app
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist"
          lipo -archs "$APP/Contents/MacOS/PepBox"
          test -f "$APP/Contents/Resources/PepBox.alfredworkflow"
          find "$APP/Contents/Resources" -name 'ai-bg.jpg' | grep -q . || { echo "ExtensionMedia not bundled"; exit 1; }

      - name: Launch smoke test
        run: |
          APP=build/Build/Products/Release/PepBox.app
          "$APP/Contents/MacOS/PepBox" > launch.log 2>&1 &
          PID=$!
          sleep 20
          if kill -0 $PID 2>/dev/null; then
            echo "PepBox is still running after 20s"
            kill $PID
          else
            wait $PID; echo "PepBox exited early with status $?"; cat launch.log; exit 1
          fi
          tail -40 launch.log

      - name: Package DMG
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/Build/Products/Release/PepBox.app/Contents/Info.plist)
          mkdir -p dmg_root
          cp -R build/Build/Products/Release/PepBox.app dmg_root/
          ln -s /Applications dmg_root/Applications
          hdiutil create -volname PepBox -srcfolder dmg_root -ov -format UDZO "PepBox-$VERSION.dmg"
          shasum -a 256 PepBox-*.dmg

      - name: UI test (drives the app with synthetic mouse and keyboard)
        run: scripts/uitest/run.sh build/Build/Products/Release/PepBox.app ui-results

      - name: Publish UI test results to the ui-test-results branch
        if: always() && github.event_name != 'pull_request'
        run: |
          [ -d ui-results ] || exit 0
          rm -f ui-results/driver
          cd ui-results
          git init -q -b ui-test-results
          git add -A
          git -c user.name="PepBox CI" -c user.email="ci@users.noreply.github.com" \
            commit -qm "UI test results for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ui-test-results

      - uses: actions/upload-artifact@v4
        with:
          name: PepBox-dmg
          path: PepBox-*.dmg

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: |
            build.log
            launch.log
          if-no-files-found: ignore
